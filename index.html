                        {t.adaptations.kneeList.map((item, i) => (
                          <li key={i} className="flex items-start text-stone-700 text-sm">
                            <i className="ph-fill ph-check-circle text-teal-500 mr-2 mt-0.5"></i> {item}
                          </li>
                        ))}
                      </ul>
                    </div>
                    
                    <div className="bg-sky-50/50 rounded-xl p-6 border border-sky-100">
                      <h4 className="font-bold text-sky-800 mb-4 flex items-center gap-2">
                        <i className="ph ph-anchor-simple text-sky-600 text-xl"></i>
                        {t.adaptations.strapTitle}
                      </h4>
                      <ul className="space-y-3">
                        {t.adaptations.strapList.map((item, i) => (
                          <li key={i} className="flex items-start text-stone-700 text-sm">
                            <i className="ph-fill ph-check-circle text-sky-500 mr-2 mt-0.5"></i> {item}
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: MANTRAS */}
            {activeTab === 'mantras' && (
              <div className="fade-in space-y-6">
                <div className="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-stone-200">
                  <h3 className="text-xl font-bold text-teal-800 mb-6 flex items-center gap-2">
                    <i className="ph-fill ph-hands-praying text-teal-600 text-2xl"></i>
                    {t.mantras.openingTitle}
                  </h3>
                  <div className="grid md:grid-cols-2 gap-8">
                    <div>
                      <h4 className="text-sm font-bold text-stone-400 uppercase tracking-wider mb-4">Sânscrito</h4>
                      <pre className="font-sans text-stone-700 italic leading-relaxed whitespace-pre-wrap">{t.mantras.openingSanskrit}</pre>
                    </div>
                    <div className="pt-6 md:pt-0 md:border-l md:border-stone-100 md:pl-8">
                      <h4 className="text-sm font-bold text-stone-400 uppercase tracking-wider mb-4">Tradução</h4>
                      <pre className="font-sans text-stone-600 leading-relaxed whitespace-pre-wrap">{t.mantras.openingTranslation}</pre>
                    </div>
                  </div>
                </div>

                <div className="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-stone-200">
                  <h3 className="text-xl font-bold text-stone-800 mb-6 flex items-center gap-2">
                    <i className="ph ph-om text-stone-600 text-2xl"></i>
                    {t.mantras.closingTitle}
                  </h3>
                  <div className="grid md:grid-cols-2 gap-8">
                    <div>
                      <h4 className="text-sm font-bold text-stone-400 uppercase tracking-wider mb-4">Sânscrito</h4>
                      <pre className="font-sans text-stone-700 italic leading-relaxed whitespace-pre-wrap">{t.mantras.closingSanskrit}</pre>
                    </div>
                    <div className="pt-6 md:pt-0 md:border-l md:border-stone-100 md:pl-8">
                      <h4 className="text-sm font-bold text-stone-400 uppercase tracking-wider mb-4">Tradução</h4>
                      <pre className="font-sans text-stone-600 leading-relaxed whitespace-pre-wrap">{t.mantras.closingTranslation}</pre>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Ad Banner Fixo e Modal de Pagamento */}
          {!isPremium && <AdBanner t={t} />}
          <PremiumModal 
            isOpen={modalOpen} 
            onClose={() => setModalOpen(false)} 
            onBuy={() => {
              setIsPremium(true);
              setModalOpen(false);
            }}
            t={t}
          />

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
